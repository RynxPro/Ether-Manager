[package]
name = "ether-manager"
version = "0.1.0"
description = "A mod manager/browser for Zenless Zone Zero, built on the GameBanana API and XXMI"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ether_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
zip = "8.6.0"
sevenz-rust2 = "0.20.2"
unrar = "0.5.8"
tauri-plugin-dialog = "2.7.2"
reqwest = { version = "0.12", features = ["json", "stream"] }
# `sync` is for the download queue's one-at-a-time permit — tokio's Mutex hands the permit to
# waiters in arrival order, which is what makes the queue FIFO without a scheduler of its own.
# `time` is for the stop poll in `download_file` — a stalled transfer has to stay interruptible,
# and the only way to ask is to time out the wait for the next chunk. `macros` is for the
# `select!`s that race the slow parts of starting a download against a cancellation; it lives here
# rather than only in dev-dependencies because the app itself needs it, and having it only there
# built the tests fine while leaving the app unable to compile.
tokio = { version = "1", features = ["fs", "sync", "time", "macros"] }
futures-util = "0.3"
tauri-plugin-window-state = "2.4.1"

[dev-dependencies]
# `net`/`io-util` stand up a deliberately silent HTTP server in-process, which is the only honest
# way to test that a stalled download can still be stopped.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util"] }

