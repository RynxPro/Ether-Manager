# Builds, signs and publishes a release when a version tag is pushed.
#
#   npm version 0.1.1 --no-git-tag-version   # then match src-tauri/tauri.conf.json
#   git commit -am "release: 0.1.1" && git tag v0.1.1 && git push --follow-tags
#
# The tag is the only trigger, so ordinary commits cost no CI minutes. Pushing a branch builds
# nothing at all - `testing` is where code lives, not a build channel.
#
# A tag carrying a hyphen is published as a prerelease:
#
#   v0.2.0          a release. Becomes "latest", so every installed copy is offered it.
#   v0.2.0-beta.1   a prerelease. Built and signed exactly the same, but GitHub never counts a
#                   prerelease as "latest" - and the app asks for
#                   releases/latest/download/latest.json - so no user's updater can see it.
#                   Download that installer yourself to try a build before committing to it.
#
# The hyphen is semver's own marker for a prerelease, which is why it is what gets tested.
#
# Two repository secrets must exist before this can produce a usable release, and neither may
# ever be committed:
#   TAURI_SIGNING_PRIVATE_KEY           the contents of the key from `tauri signer generate`
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password, or an empty string if it was made without
#
# Without them the installer still builds, but it ships unsigned and the updater refuses
# unsigned updates - so the release would publish and nobody could take it.
name: release

on:
  push:
    tags:
      - "v*"
      # The rolling nightly. Force-moved rather than created fresh each time, so the channel has
      # an address that never changes:
      #
      #   git tag -f nightly && git push -f origin nightly
      #
      # Bump the version in tauri.conf.json and package.json above whatever Stable is on first,
      # or the app will compare the two builds, find the same number, and offer nothing.
      - "nightly"

jobs:
  windows:
    # Windows-only because the app is: it drives XXMI/ZZMI, which exists nowhere else.
    runs-on: windows-latest
    permissions:
      # tauri-action creates the release and uploads to it.
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      # Keyed on the lockfile, so a dependency change busts it and an ordinary release does not.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Checks before build. A release is the worst place to discover something did not compile.
      - run: npx tsc --noEmit
      - run: npx eslint src

      # The gamebanana module is skipped deliberately. Those tests call the live GameBanana API,
      # so they fail when the site is slow, down, or has simply changed its data - none of which
      # says anything about this build. They are worth running locally and worthless as a release
      # gate. Everything else runs: fs_ops, the repos, presets, characters.
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib -- --skip gamebanana

      # tauri-action uploads into whatever release already carries this tag, and the nightly tag
      # always does. Clearing it first means each nightly is a clean set of artifacts rather than
      # the new ones landing beside the old.
      - name: Clear the previous nightly release
        if: github.ref_name == 'nightly'
        shell: bash
        run: gh release delete nightly --yes || echo "no previous nightly to clear"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name == 'nightly' && 'Ether Manager nightly' || format('Ether Manager {0}', github.ref_name) }}
          releaseBody: ${{ github.event.head_commit.message }}
          # Published rather than drafted: the app polls releases/latest/download/latest.json,
          # and a draft is not "latest" to anyone.
          releaseDraft: false
          # True for a tag like v0.2.0-beta.1, false for v0.2.0. A prerelease still builds, still
          # signs and still uploads latest.json beside its installer - it simply never becomes
          # the "latest" release, which is the only one the updater ever asks for. That is what
          # makes it safe to publish a build only you will install.
          prerelease: ${{ contains(github.ref_name, '-') || github.ref_name == 'nightly' }}
          # uploadUpdaterJson and uploadUpdaterSignatures both default to true, which is what
          # writes latest.json and the .sig beside the installer. Left implicit rather than
          # restated, so they cannot drift out of step with the action's own defaults.
